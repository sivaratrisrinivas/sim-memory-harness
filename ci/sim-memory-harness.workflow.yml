name: sim-memory-harness
on:
  pull_request:
    paths: ['sim-memory-harness/**', 'sim-memory-harness/ci/**']
  push:
    branches: [main]
    paths: ['sim-memory-harness/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sim-memory-harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sim-memory-harness/package-lock.json
      - run: npm ci
      - run: npm run check
